version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Bugs and correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - noctx
    - nilerr
    - errorlint
    - copyloopvar
    - makezero
    - bidichk

    # Complexity
    - gocyclo
    - cyclop
    - gocognit
    - funlen
    - nestif

    # Code quality and style
    - dupl
    - goconst
    - gocritic
    - revive
    - unconvert
    - unparam
    - misspell
    - prealloc
    - whitespace
    - godot

    # Security
    - gosec

  settings:
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 20
      package-average: 15.0
    gocognit:
      min-complexity: 20
    funlen:
      lines: 100
      statements: 50
    govet:
      enable-all: true
      disable:
        - fieldalignment
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    revive:
      rules:
        - name: exported
        - name: unreachable-code
        - name: unused-parameter
    gosec:
      excludes:
        - G104 # Covered by errcheck
        - G204 # Running configured hook commands is the whole point of this tool
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US

  exclusions:
    generated: lax
    paths:
      - example_repos
    rules:
      - path: _test\.go$
        linters:
          - funlen
          - dupl
          - gocognit
          - gocyclo
          - cyclop
          - gosec
          - errcheck
          - goconst
          - prealloc
          - noctx
      # Lookup tables of file type tags.
      - path: filetypes\.go$
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - example_repos

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
