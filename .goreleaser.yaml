# GoReleaser configuration: https://goreleaser.com/customization/
# Releases are built by .github/workflows/release.yml when a v* tag is pushed.
version: 2

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: tree-commit
    main: .
    binary: tree-commit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: tree-commit
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/*.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  draft: false
  prerelease: auto
