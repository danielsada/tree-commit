# Repository-wide checks. Every directory inherits these hooks. Nested
# .tree-commit-config.yaml files can override a hook by redefining its id,
# or turn it off with `disable: true`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      # uvx runs a pinned tool version in a cached, isolated environment,
      # so nobody needs ruff or codespell installed globally.
      - id: ruff-check
        name: ruff check
        entry: uvx ruff@0.17.6 check --fix --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uvx ruff@0.17.6 format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: codespell
        name: codespell
        entry: uvx codespell@2.4.3
        language: system
        types: [text]
        exclude: (^|/)(uv\.lock|go\.sum)$
