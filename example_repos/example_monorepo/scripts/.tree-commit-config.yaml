# Shell tooling, installed on demand with uvx (shellcheck-py and shfmt-py
# ship the native binaries as Python wheels).
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: uvx --from shellcheck-py shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: uvx --from shfmt-py shfmt -w -i 4 -ci
        language: system
        types: [shell]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
