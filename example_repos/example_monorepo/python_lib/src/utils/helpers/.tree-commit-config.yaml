repos:
  - repo: local
    hooks:
      - id: python-format-minimal
        name: Python Format (Black - minimal)
        entry: black --line-length 79
        language: python
        files: \.py$
        include_folders:
          - .
        exclude_folders:
          - __pycache__/

      - id: helper-specific-lint
        name: Helper-specific linting
        entry: flake8 --select E9,F63,F7,F82
        language: python
        files: \.py$
        include_folders:
          - .
        exclude_folders:
          - __pycache__/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-builtin-literals
        files: \.py$
        include_folders:
          - .
        exclude_folders:
          - __pycache__/