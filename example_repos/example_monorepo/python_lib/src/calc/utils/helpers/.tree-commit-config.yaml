# These helpers are shared with a tool that still enforces 79 columns.
# Overrides the root ruff-format hook for this directory only.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (79 columns)
        entry: uvx ruff@0.17.6 format --force-exclude --line-length 79
        language: system
        types_or: [python, pyi]
