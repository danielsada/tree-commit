repos:
  - repo: local
    hooks:
      - id: python-type-check
        name: Python Type Check (mypy)
        entry: mypy
        language: python
        files: \.py$
        include_folders:
          - .
        exclude_folders:
          - __pycache__/

      - id: python-security
        name: Python Security Check (bandit)
        entry: bandit -r
        language: python
        files: \.py$
        pass_filenames: false
        include_folders:
          - .
        exclude_folders:
          - __pycache__/
          - tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: debug-statements
        files: \.py$
        include_folders:
          - .
        exclude_folders:
          - __pycache__/