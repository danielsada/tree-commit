repos:
  - repo: local
    hooks:
      - id: markdownlint
        name: Markdown Lint
        entry: markdownlint
        language: node
        files: \.md$
        include_folders:
          - .
        exclude_folders:
          - generated/
          - node_modules/

      - id: spell-check
        name: Spell Check
        entry: cspell
        language: node
        files: \.md$
        include_folders:
          - .
        exclude_folders:
          - generated/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        files: \.md$
        include_folders:
          - .
        exclude_folders:
          - generated/

      - id: end-of-file-fixer
        files: \.md$
        include_folders:
          - .
        exclude_folders:
          - generated/