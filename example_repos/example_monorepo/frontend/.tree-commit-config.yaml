# JavaScript tooling comes from the project's own node_modules
# (run `npm install` first). Requires Node.js.
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: node
        types_or: [javascript, jsx, ts, tsx, css, json]

      - id: eslint
        name: eslint
        entry: npx --no-install eslint --fix
        language: node
        types_or: [javascript, jsx, ts, tsx]
        include_folders: [src/]

      - id: tsc
        name: tsc
        entry: npx --no-install tsc --noEmit
        language: node
        types_or: [ts, tsx]
        pass_filenames: false
